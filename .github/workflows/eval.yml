name: RAG eval

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  ragas-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r eval/requirements-eval.txt

      - name: Run RAGAS eval against the fixed test set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional -- if unset, observability.py disables tracing and the
          # eval run is unaffected.
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: python eval/run_eval.py --threshold 0.7

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-eval-report
          path: eval/results/latest.json
